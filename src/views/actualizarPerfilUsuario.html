<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACTUALIZAR DATOS USUARIO</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="shortcut icon" href="../images/letra_logo.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@3.0.0/dist/iconify-icon.min.js"></script>
</head>

<body>
    <main class="content-form">
        <section class="section-container">
            <div class="container-user">
                <iconify-icon icon="ph:user-circle-light" class="icon icon--user-agrandado"></iconify-icon>
            </div>
            <form action="" method="POST" class="form form--espaciado_arriba" novalidate>
                <h1 class="title-principal title-principal--turquesa-medio">Datos del Usuario</h1>
                <div class="form__content">
                    <input class="input" type="text" id="nombres" name="nombres" placeholder="Nombres" required>
                </div>

                <div class="form__content">
                    <input class="input" type="text" id="apellidos" name="apellidos" placeholder="Apellidos" required>
                </div>

                <div class="form__content">
                    <input class="input" type="email" id="email" name="email" placeholder="Email" required>
                </div>

                <div class="form__content">
                    <input class="input" type="tel" id="telefono" name="telefono" placeholder="Numero Telefono"
                        required>
                </div>

                <div class="form__content">
                    <select class="select" id="ciudad" name="ciudad" required>
                        <option class="option" value="">Selecciona una ciudad</option>
                        <option class="option" value="1">Piedecuesta</option>
                        <option class="option" value="2">Bucaramanga</option>
                        <option class="option" value="3">Floridablanca</option>
                        <option class="option" value="4">Giron</option>
                    </select>
                </div>

                <div class="form__content">
                    <select class="select" id="rol" name="rol" required>
                        <option class="option" value="">Selecciona un rol</option>
                        <option class="option" value="comprador">Comprador</option>
                        <option class="option" value="vendedor">Vendedor</option>
                    </select>
                </div>

                <div class="form__content">
                    <input class="input" type="text" id="direccion" name="direccion" placeholder="Direccion" required>
                </div>

                <div class="form__content">
                    <input class="input" type="password" id="contrasena" name="contrasena" placeholder="Contraseña"
                        required>
                </div>

                <div class="form__content">
                    <input class="input" type="password" id="confirmar-contrasena" name="confirmar_contrasena"
                        placeholder="Confirmar Contraseña" required>
                </div>
                <div class="form__container-botones">
                    <div class="form__button-wrapper">
                        <button class="button button--gradiente-agua-turquesa button--ancho-amplio">
                            <iconify-icon icon="solar:refresh-bold" class="icon icon--blanco-agrandado"></iconify-icon>
                            Actualizar
                        </button>
                        <button class="button button--gradiente-agua-turquesa button--ancho-amplio">
                            <iconify-icon icon="mi:chevron-double-left" class="icon icon--blanco-agrandado"></iconify-icon>
                            Regresar
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
