<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GESTION-USUARIOS</title>
  <link rel="stylesheet" href="../../styles/style.css">
  <link rel="shortcut icon" href="../../images/letra_logo.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@3.0.0/dist/iconify-icon.min.js"></script>
</head>
<body>
  <header class="header header--static">
    <div class="header-container header-nav--sin_gradiente">
      <div class="header-content header-content--sin_borde_redondeado">
        <img class="img img--tamanio_reduccion" src="../../images/logo_completo.png" alt="logo">
        <nav class="nav">
          <ul class="nav-content__list">
            <li class="nav-content__list-item">
              <a class="link link--turquesa_oscuro-texto_sin_sombra" href="../vistaAministrador.html">Inicio</a>
            </li>
            <div class="nav-content__list-item nav-content__list-item--busqueda nav-content__list-item--ancho">
              <iconify-icon icon="lets-icons:search-duotone" class="icon"></iconify-icon>
              <input class="input input--sin_borde-sin_sombra" type="search" id="busqueda" name="busqueda"
                placeholder="Buscar usuarios por nombre" required>
            </div>
          </ul>
        </nav>
        <div class="nav-content__list-item">
          <div class="header-content__user">
            <input class="input__check" type="checkbox" id="activo">
            <label for="activo" class="label__icon">
              <iconify-icon icon="mdi:user-tie" class="icon icon--tamanio_aumentado"></iconify-icon>
            </label>
            <!-- PANEL USUARIO  -->
            <div class="panel-user">
              <div class="panel__close-container">
                <label for="activo" class="panel__close">
                  <iconify-icon icon="material-symbols:close-small-outline-rounded" class="icon icon--cerrar-panel"></iconify-icon>
                </label>
              </div>
              <div class="panel__top">
                <div class="panel__content panel__content--sin_hover">
                  <div class="panel__content-profile">
                    <h1 class="title-principal title-principal--tamanio_reduccion_sin_sombra">Dylan Slebyng Bravo Becerra
                    </h1>
                    <a href="actualizarPerfilAdmin.html" class="link link--subrayado_verde_menta">Actualizar Perfil</a>
                  </div>
                  <iconify-icon icon="mdi:user-tie" class="icon icon--tamanio_aumentado"></iconify-icon>
                </div>
                <a href="gestionUsuarios.html" class="panel__content panel__content--fondo-azul-palido">
                  <iconify-icon icon="clarity:group-solid"
                    class="icon icon--panel-tamanio_aumentado"></iconify-icon>
                  <h3 class="title-principal title-principal--sin_sombra">Gestión de Usuarios</h3>
                </a>
                <a href="../vistaAministrador.html" class="panel__content panel__content--fondo-azul-palido">
                  <iconify-icon icon="mdi:clipboard-edit-outline" class="icon icon--panel-tamanio_aumentado"></iconify-icon>
                  <h3 class="title-principal title-principal--sin_sombra">Gestión de Artículos</h3>
                </a>
              </div>
              <div class="panel__bottom">
                <a href="#" class="panel__content panel__content--fondo-azul-palido">
                  <iconify-icon icon="codicon:sign-out" class="icon icon--panel-tamanio_aumentado"></iconify-icon>
                  <h3 class="title-principal title-principal--sin_sombra">Cerrar Sesion</h3>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="content-table">
    <h1 class="title-principal title-principal--centrado-disminuido">Gestión de Usuarios</h1>
    <div class="table-container">
      <!-- DINAMICAMENTE DESDE EL JS SE CREA LA TABLA PARA CARGAR LOS USUARIOS -->
    </div>
  </main>
 <!-- Modal editar informacion del usuario -->
  <section class="modal" id="modalEditarDatosUsuario">
    <div class="modal__container modal__container--ampliado modal__container--sin-espaciado">
      <!-- Header -->
      <div class="modal__header">
        <h1 class="title-principal title-principal--turquesa-medio">Actualizar Datos Usuario</h1>
      </div>

      <div class="modal__body modal__body--ancho-completo">
        <form id="form-create-articulo" method="post" class="form form--ancho_aumentado form--sin-estilo-visual"
          enctype="multipart/form-data" novalidate>
          <div class="form__content">
            <input class="input" type="text" id="nombres" name="nombres" placeholder="Nombres" required>
          </div>
      
          <div class="form__content">
            <input class="input" type="text" id="apellidos" name="apellidos" placeholder="Apellidos" required>
          </div>
      
          <div class="form__content">
            <input class="input" type="email" id="email" name="email" placeholder="Email" required>
          </div>
      
          <div class="form__content">
            <input class="input" type="tel" id="telefono" name="telefono" placeholder="Numero Telefono" required>
          </div>
      
          <div class="form__content">
            <select class="select" id="ciudad" name="ciudad" required>
              <option class="option" value="">Selecciona una ciudad</option>
              <option class="option" value="1">Piedecuesta</option>
              <option class="option" value="2">Bucaramanga</option>
              <option class="option" value="3">Floridablanca</option>
              <option class="option" value="4">Giron</option>
            </select>
          </div>
      
          <div class="form__content">
            <select class="select" id="rol" name="rol" required>
              <option class="option" value="">Selecciona un rol</option>
              <option class="option" value="comprador">Comprador</option>
              <option class="option" value="vendedor">Vendedor</option>
            </select>
          </div>
      
          <div class="form__content">
            <input class="input" type="text" id="direccion" name="direccion" placeholder="Direccion" required>
          </div>
      
          <div class="form__content">
            <input class="input" type="password" id="contrasena" name="contrasena" placeholder="Contraseña" required>
          </div>
      
          <div class="form__content">
            <input class="input" type="password" id="confirmar-contrasena" name="confirmar_contrasena"
              placeholder="Confirmar Contraseña" required>
          </div>
          <div class="modal__botones modal__botones--ancho-limitado">
            <button class="button button--gradiente-agua-turquesa button--ancho-amplio" id="cerrarModal">
              <iconify-icon icon="solar:refresh-bold" class="icon icon--blanco-agrandado"></iconify-icon>
              Actualizar
            </button>
            <button class="button button--gradiente-agua-turquesa button--gradiente-rojo button--ancho-amplio"
              id="cerrarModalEditarUsuarioAdmin">
              <iconify-icon icon="iconamoon:close-circle-1-light" class="icon icon--blanco-agrandado"></iconify-icon>
              Cerrar
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>
  <script type="module" src="../../js/admin/gestionUsuarios.js"></script>
</body>
</html>
